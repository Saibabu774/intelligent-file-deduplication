services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: file_dedup_db
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: mysql+pymysql://root:password@mysql:3306/file_dedup_db
      REDIS_URL: redis://redis:6379/0
    volumes: ["./backend:/app"]
    depends_on: [mysql,redis]
  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app.celery worker --loglevel=info
    env_file: ./backend/.env
    environment:
      DATABASE_URL: mysql+pymysql://root:password@mysql:3306/file_dedup_db
      REDIS_URL: redis://redis:6379/0
    volumes: ["./backend:/app"]
    depends_on: [mysql,redis]
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    volumes: ["./frontend:/app"]
    depends_on: [backend]
volumes:
  mysql_data:
